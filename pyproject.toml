[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "long-run-agent-skill"
version = "1.0.0"
description = "Standalone local epistemic compiler for long-running agent work"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "mcp>=1.29,<2",
]

[project.scripts]
long-run-agent = "long_run_agent_skill.cli:main"
long-run-agent-mcp = "long_run_agent_skill.mcp_server:main"

[tool.setuptools.packages.find]
include = ["long_run_agent_skill*"]

[tool.setuptools.data-files]
"share/long-run-agent-skill/scripts" = ["scripts/*.py"]
"share/long-run-agent-skill/schemas" = ["schemas/*.json"]
